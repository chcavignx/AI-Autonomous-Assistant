# AI Autonomous Assistant Configuration

# Directory paths relative to project root
paths:
  src: "src"
  data: "data"
  cache: ".cache"
  models: "models"

# Platform-specific configuration
platform:
  cpu_cores: 2  # Limit CPU cores for multiprocessing on Pi5
  pi: true  # Automatically detect Raspberry Pi and apply tuning

# Vision profile selection (modular configuration)
# Available profiles in config/vision/:
#   - "config/vision/config_vision_hailo.yaml"      (Hailo-8/8L NPU: YOLOv8s + SCRFD 2.5G + ArcFace)
#   - "config/vision/config_vision_cpu.yaml"        (Pi5 CPU: YOLO ONNX + Cascade / InsightFace)
#   - "config/vision/config_vision_imx500.yaml"     (Sony IMX500 AI Camera: On-Sensor RPK SSD + ArcFace)
#   - "config/vision/config_vision_ncnn.yaml"       (Pi5 CPU: YOLO26 NCNN + Cascade)
#   - "config/vision/config_vision_libreyolo.yaml"  (Pi5 CPU: LibreYOLOXn + Cascade)
vision_config: "config/vision/config_vision_cpu.yaml"

# Audio stream configuration (Microphone & Speaker)
audio:
  input_sample_rate: 48000
  input_chunk_ms: 300  # audio chunk size in ms
  input_chunk_size: 1024
  input_device_index: 0
  input_device_name: 'USB ENC Audio Device'  # Optional name of input device (overrides index if found)
  volume: 0.8
  output_device_index: 1  # default to USB PnP Audio Device: Audio (hw:3,0)
  output_sample_rate: 44100
  output_chunk_ms: 300
  output_chunk_size: 1024
  output_device_name: 'USB PnP Audio Device'

# Voice Activity Detection (VAD)
vad:
  min_speech_duration_ms: 100
  min_silence_duration_ms: 500
  silence_timeout_seconds: 1
  max_recording_seconds: 15
  threshold: 0.6
  sample_rate: 44100

# Automatic Speech Recognition (ASR / STT)
asr:
  engine: "faster-whisper" # "whisper", "faster-whisper"
  model_size: "tiny"
  faster_model_size: "small"
  language: "en"
  translate: false
  transformers: true
  transformers_engine: "huggingface" # "huggingface" or "onnxruntime"
  device: "cpu"  # Pi5: CPU (or "hailo")
  compute_type: "int8"
  download_root: null # Let Python code build the path dynamically
  skip_native_teardown: false
  store_audio: true
  store_audio_path: ".tmp/asr.wav"

# Wake word detection
wake:
  wake_word: "hello_jarvis"
  backend: "wakeword"
  model_name: "hey_jarvis_v0.1"
  model_path: null
  inference_framework: "onnx"
  threshold: 0.4
  cooldown_seconds: 2.0
  noise_suppression: true
  download_root: ".cache/audio/models/wakeword"

# Text-to-Speech (TTS)
tts:
  engine: "piper"
  model_name: "jarvis-medium.onnx"
  model_path: null # Let Python code build the path dynamically
  cli_mode: false
  device: "cpu"
  length_scale: 1.0
  noise_scale: 1.0
  noise_w_scale: 1.0
  normalize_audio: true
  speed: 1.0
  volume: 0.5

# Local LLM settings
llm:
  api_type: "ollama"
  model: "llama3.2:latest"
  url: "http://127.0.0.1:11434/api/generate"
  timeout: 30.0
  api_key: null
