repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff check --fix (commit)
        stages: [pre-commit]
        args: [--fix]
        description: "Run 'ruff check' for extremely fast Python linting"
      - id: ruff-format
        name: ruff-format (commit)
        stages: [pre-commit]
        description: "Run 'ruff format' for extremely fast Python formatting"
      - id: ruff
        name: ruff check (push)
        stages: [pre-push]
        description: "Run 'ruff check' for extremely fast Python linting"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        description: "Run 'trailing-whitespace' for removing trailing whitespace"
      - id: end-of-file-fixer
        description: "Run 'end-of-file-fixer' for removing end of file"
      - id: check-yaml
        description: "Run 'check-yaml' for checking YAML files"
      - id: check-json
        description: "Run 'check-json' for checking JSON files"
      - id: check-toml
        description: "Run 'check-toml' for checking TOML files"
      - id: detect-private-key
        description: "Run 'detect-private-key' for detecting private keys"
      - id: check-added-large-files
        description: "Run 'check-added-large-files' for checking added large files"
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        description: "Run 'conventional-pre-commit' for conventional commit messages"
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright strict type-check (push)
        entry: uv run basedpyright --level error
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
